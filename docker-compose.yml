# Single-VPS deployment: Caddy terminates HTTPS (Telegram requires it for Mini
# Apps) and proxies to the app, which serves the Mini App and API from one
# origin. Copy .env.example to .env and fill it in.
services:
  kcal:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      APP_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      ALLOW_USER_IDS: ${ALLOW_USER_IDS:-}
      DAILY_ANALYSIS_LIMIT: ${DAILY_ANALYSIS_LIMIT:-30}
      ESTIMATOR: ${ESTIMATOR:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-}
    volumes:
      - kcal-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kcal

volumes:
  kcal-data:
  caddy-data:
  caddy-config:
